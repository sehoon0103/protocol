name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-format cppcheck
      - name: Check formatting
        run: clang-format --dry-run --Werror main.c
      - name: Static analysis
        run: cppcheck --enable=warning,style --error-exitcode=1 main.c
      - name: Build
        run: gcc -Wall -Wextra -o main main.c